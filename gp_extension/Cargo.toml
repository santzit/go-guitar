[package]
name = "gp_extension"
version = "0.1.0"
edition = "2021"
description = "Godot 4 GDExtension that parses Guitar Pro files via scorelib"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Godot 4 Rust bindings
godot = { git = "https://github.com/godot-rust/gdext", branch = "master" }

# Guitar Pro parser – package is named "lib" in the workspace, crate name is "scorelib"
scorelib = { git = "https://github.com/slundi/guitarpro", package = "lib" }

[profile.release]
opt-level    = 3
lto          = true
codegen-units = 1
strip        = true
